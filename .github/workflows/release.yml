name: Release
run-name: Release v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Windows runner 上 turbo daemon 与 vite 8(rolldown) 的 stdout 管道存在挂死竞态
      # （构建产物已生成但进程不退出）——禁用 daemon + 超时保险，挂死快速失败而非空耗 6h
      - run: pnpm build
        timeout-minutes: 20
        env:
          TURBO_DAEMON: "false"
      - run: pnpm dist
        timeout-minutes: 20
        env:
          TURBO_DAEMON: "false"
      - name: List release artifacts
        run: Get-ChildItem -Recurse release/
      - id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.ver.outputs.v }}
          tag_name: v${{ steps.ver.outputs.v }}
          generate_release_notes: true
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ github.token }}
