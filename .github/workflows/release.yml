name: Release
run-name: Release v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      - run: pnpm install --frozen-lockfile
      # Windows runner 上 turbo/vite 8(rolldown) 存在子进程句柄偶发残留竞态，
      # 构建产物已生成但壳进程不退出——加超时保险，挂死时快速失败而非空耗 6h job 超时
      - run: pnpm build
        timeout-minutes: 20
      - run: pnpm dist
        timeout-minutes: 20
      - name: List release artifacts
        run: Get-ChildItem -Recurse release/
      - id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.v }}
          tag_name: v${{ steps.ver.outputs.v }}
          generate_release_notes: true
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ github.token }}
