name: Release
run-name: Release v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
concurrency:
  # 同一版本只允许一条发布流水线，且不取消在跑的（打包中途取消会留下半成品 Release / 已上传的 exe）。
  group: release-v${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    # 单步已有 20m 保险（build / dist），这里给整 job 兜底：runner 挂死时快速失败而非空耗 6h
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      # pnpm/action-setup 固定 v5：v6 指定 version 时装错 pnpm 版本（pnpm/action-setup#225，见 CHANGELOG 2026-09-01）
      - uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 版本一致性闸门：tag 名与 package.json/APP_VERSION 不一致时立刻失败——否则会把
      # 「Release 标题 vA、exe 实际报 vB」的产物发出去（打包侧历史陷阱，见 docs/packaging.md §11.7）
      - name: 校验 tag 版本与 package.json 一致
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          APP=$(sed -n "s/^export const APP_VERSION = '\\([^']*\\)'.*/\\1/p" packages/shared/src/params/definitions.ts)
          echo "tag=v$INPUT_VERSION  package.json=$PKG  APP_VERSION=$APP"
          if [ "$PKG" != "$INPUT_VERSION" ]; then
            echo "::error::package.json 版本 $PKG ≠ 请求的发布版本 v$INPUT_VERSION"
            exit 1
          fi
          if [ -n "$APP" ] && [ "$APP" != "$INPUT_VERSION" ]; then
            echo "::error::APP_VERSION $APP ≠ 请求的发布版本 v$INPUT_VERSION"
            exit 1
          fi
      # Windows runner 上 turbo daemon 与 vite 8(rolldown) 的 stdout 管道存在挂死竞态
      # （构建产物已生成但进程不退出）——禁用 daemon + 超时保险，挂死快速失败而非空耗 6h
      - run: pnpm build
        timeout-minutes: 20
        env:
          TURBO_DAEMON: "false"
      - run: pnpm dist
        timeout-minutes: 20
        env:
          TURBO_DAEMON: "false"
      - name: List release artifacts
        run: Get-ChildItem -Recurse release/
      - id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.ver.outputs.v }}
          tag_name: v${{ steps.ver.outputs.v }}
          generate_release_notes: true
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ github.token }}
