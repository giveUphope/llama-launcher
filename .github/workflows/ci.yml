name: CI
run-name: CI - ${{ github.ref_name }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # build 必须先于 lint：tsc project references 需 shared/core 的 dist 产物（见 docs/ci-cd.md §2.3）
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
  # Web 渲染层 E2E + Electron 冒烟（与 verify 并行）。
  # 纯文档变更（changes 判定 non-doc=false）跳过 E2E——不发版、渲染逻辑未动，无需 Playwright。
  # 注：job 级无 paths-ignore（事件级才支持），故复用 changes job 的输出做门控。
  # Web E2E 走真实构建产物（内部先构建 ui + vite preview + demo-mock）；Electron 冒烟在 Linux 用 xvfb 虚拟显示。
  e2e:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.non-doc == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 不单独构建全量产物：e2e:web / e2e:electron 内部各自 build（ui/desktop），turbo 本地缓存去重
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Web 渲染层 E2E
        run: pnpm e2e:web
      - name: Electron 冒烟（xvfb 虚拟显示）
        run: xvfb-run -a pnpm e2e:electron
  # 判定本次 push 是否仅涉及文档（docs/** 与仓库根 README.md / AGENTS.md）。
  # 纯文档提交跳过 bump job —— 文档更新不会递增版本、不会发布 Release；
  # 仅非文档变更（代码/配置/依赖等）才触发自动发版。
  # 实现：checkout 后以 push 前基线（github.event.before）为基准，git diff 解析真实文件清单
  # （不依赖 webhook commits[].modified 字段——Actions 环境中该字段不可靠）。
  changes:
    runs-on: ubuntu-latest
    outputs:
      non-doc: ${{ steps.changes.outputs.non-doc }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        run: |
          BASE="${{ github.event.before }}"
          NON_DOC="false"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # 仓库首次 push（无基线）：保守视为非文档变更，走正常发版
            NON_DOC="true"
          else
            FILES=$(git diff --name-only "$BASE" HEAD)
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                docs/*|README.md|AGENTS.md) ;;
                *) NON_DOC="true"; break ;;
              esac
            done <<< "$FILES"
          fi
          echo "non-doc=$NON_DOC" >> "$GITHUB_OUTPUT"
  bump:
    needs: [verify, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' && needs.changes.outputs.non-doc == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      # bump-version.cjs 为纯 node 脚本（无 npm 依赖），本 job 无需 pnpm install
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/bump-version.cjs patch
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - run: |
          git add -A
          git commit -m "chore(release): v${{ steps.ver.outputs.v }}"
          git tag -a "v${{ steps.ver.outputs.v }}" -m "v${{ steps.ver.outputs.v }}"
          git push origin HEAD:main
          git push origin "v${{ steps.ver.outputs.v }}"
      - name: Trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml -f version="${{ steps.ver.outputs.v }}"
