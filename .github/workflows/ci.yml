name: CI
run-name: CI - ${{ github.ref_name }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
  # 判定本次 push 是否仅涉及文档（docs/** 与仓库根 README.md / AGENTS.md）。
  # 纯文档提交跳过 bump job —— 文档更新不会递增版本、不会发布 Release；
  # 仅非文档变更（代码/配置/依赖等）才触发自动发版。
  # 实现：checkout 后以 push 前基线（github.event.before）为基准，git diff 解析真实文件清单
  # （不依赖 webhook commits[].modified 字段——Actions 环境中该字段不可靠）。
  changes:
    runs-on: ubuntu-latest
    outputs:
      non-doc: ${{ steps.changes.outputs.non-doc }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        run: |
          BASE="${{ github.event.before }}"
          NON_DOC="false"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # 仓库首次 push（无基线）：保守视为非文档变更，走正常发版
            NON_DOC="true"
          else
            FILES=$(git diff --name-only "$BASE" HEAD)
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                docs/*|README.md|AGENTS.md) ;;
                *) NON_DOC="true"; break ;;
              esac
            done <<< "$FILES"
          fi
          echo "non-doc=$NON_DOC" >> "$GITHUB_OUTPUT"
  bump:
    needs: [verify, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' && needs.changes.outputs.non-doc == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node scripts/bump-version.cjs patch
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - run: |
          git add -A
          git commit -m "chore(release): v${{ steps.ver.outputs.v }}"
          git tag -a "v${{ steps.ver.outputs.v }}" -m "v${{ steps.ver.outputs.v }}"
          git push origin HEAD:main
          git push origin "v${{ steps.ver.outputs.v }}"
      - name: Trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml -f version="${{ steps.ver.outputs.v }}"
