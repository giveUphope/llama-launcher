name: CI
run-name: CI - ${{ github.ref_name }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # push 到 main 不取消在跑的运行：release job 会在一个 run 内 tag → push tag → 触发 Release，
  # 中途取消仍可能留下「tag 已推、Release 未触发」的半程状态（job 仅剩秒级操作，串行排队代价可忽略）。
  # PR 仍是新提交取消旧运行。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # 判定本次变更是否仅涉及文档（docs/** 与仓库根 README.md / README.en.md / AGENTS.md）。
  # 纯文档提交跳过 release job（不发版）并跳过 E2E（渲染逻辑未动，无需 Playwright）。
  # 2026-10-09 起用 dorny/paths-filter 替换手写 diff 循环；基线仍按事件显式分取：
  #   - pull_request：github.event.pull_request.base.sha（checkout 的是 PR merge commit）；
  #   - push：github.event.before。
  # 动作不处理「首推 before=0000」等基线不可解析场景 ⇒ filter 步骤 continue-on-error，
  # 下方 out 步骤对空输出兜底：一律保守视为非文档变更（照跑 E2E、照走发版判定），
  # 宁可多跑不可漏检（与旧手写版语义一致，见 docs/zh/ci-cd.md §1.3）。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      non-doc: ${{ steps.out.outputs.non-doc }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        continue-on-error: true
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          list-files: none
          filters: |
            doc:
              - 'docs/**'
              - 'README.md'
              - 'README.en.md'
              - 'AGENTS.md'
      - id: out
        env:
          DOC: ${{ steps.filter.outputs.doc }}
        run: |
          set -euo pipefail
          if [ -z "$DOC" ]; then
            echo "::warning::无法解析基线（filter 步骤失败或无输出），按「非文档变更」保守处理"
            echo "non-doc=true" >> "$GITHUB_OUTPUT"
          elif [ "$DOC" = "true" ]; then
            echo "non-doc=false" >> "$GITHUB_OUTPUT"
          else
            echo "non-doc=true" >> "$GITHUB_OUTPUT"
          fi
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup 固定 v5：v6 指定 version 时装错 pnpm 版本（pnpm/action-setup#225，见 CHANGELOG 2026-09-01）
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # build 必须先于 lint：tsc project references 需 shared/core 的 dist 产物（见 docs/zh/ci-cd.md §2.3）
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
  # Web 渲染层 E2E + Electron 冒烟（与 verify 并行）。
  # Web E2E 走真实构建产物（内部先构建 ui + vite preview + demo-mock）；Electron 冒烟在 Linux 用 xvfb 虚拟显示。
  e2e:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.non-doc == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 不单独构建全量产物：e2e:web / e2e:electron 内部各自 build（ui/desktop），turbo 本地缓存去重
      # Chromium 下载实测占本 job 最长单步（16s / 全 job 54s），按 lockfile 版本缓存
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Web 渲染层 E2E
        run: pnpm e2e:web
      - name: Electron 冒烟（xvfb 虚拟显示）
        run: xvfb-run -a pnpm e2e:electron
      # 失败现场：playwright.config.ts 的 outputDir=test-results、HTML 报告=playwright-report（均在仓库根）。
      # 无此步时失败只能靠 list 输出猜（历史多次），故仅 failure() 上传，不污染成功运行。
      - name: 上传失败诊断产物
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
  # 发版闸门（2026-10-08 起版本递增归本地）：非文档推送必须已在本地跑过
  # `node scripts/bump-version.cjs`（版本文件与 CHANGELOG 版本段随推送提交进来）。
  # 本 job 只核对「package.json 版本尚无对应 tag」，不等 ⇒ 在当前 HEAD 打 tag 并触发 Release；
  # 相等（= 忘了本地 bump）⇒ 报错退出，红牌提示补 bump 后随下次推送发版。
  # CI 从此不向 main 写任何提交——旧系统由 CI 提交 bump，远端永远比本地多一个提交，
  # 下次推送必然非快进被拒、且 CHANGELOG 的 [Unreleased] 与 CI 的段落搬移必然冲突
  # （该分叉在 2026-10-06/10-08 两次撞上，本轮根治）。
  release:
    needs: [verify, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' && needs.changes.outputs.non-doc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # bump-version.cjs 为纯 node 脚本（无 npm 依赖），本 job 无需 pnpm install
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: ver
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::非文档变更已推送，但 v$V 的 tag 已存在——本次推送没有先在本地跑 node scripts/bump-version.cjs。本地递增版本号并提交后，随下一次推送发版。"
            exit 1
          fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.ver.outputs.v }}" -m "v${{ steps.ver.outputs.v }}"
          git push origin "v${{ steps.ver.outputs.v }}"
      - name: Trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml -f version="${{ steps.ver.outputs.v }}"
